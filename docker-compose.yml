# Local development / single-host baseline. Not the production deployment
# (reverse proxy, TLS, secrets, backups and least-privilege DB roles come in P1/P7).
#
#   npm run db:up      # PostgreSQL only (for `npm run dev`)
#   npm run app:up     # PostgreSQL + app container (adds docker-compose.app.yml)
#
# Every published port binds to 127.0.0.1 only; nothing is reachable from the LAN.
services:
  db:
    image: postgres:16.15-alpine3.24
    container_name: accsys-db
    restart: unless-stopped
    ports:
      # Host 15432 to avoid colliding with other local Postgres on 5432
      - "127.0.0.1:15432:5432"
    environment:
      # `accsys` is the local superuser (DBA); the app and migrations use the
      # least-privilege roles from db/roles.sql. Dev-only passwords.
      POSTGRES_USER: accsys
      POSTGRES_PASSWORD: accsys
      POSTGRES_DB: accsys
      ACCSYS_MIGRATOR_PASSWORD: ${ACCSYS_MIGRATOR_PASSWORD:-accsys_migrator_dev}
      ACCSYS_APP_PASSWORD: ${ACCSYS_APP_PASSWORD:-accsys_app_dev}
      ACCSYS_BACKUP_PASSWORD: ${ACCSYS_BACKUP_PASSWORD:-accsys_backup_dev}
    volumes:
      - accsys_pgdata:/var/lib/postgresql/data
      # First start of an empty volume creates the roles only; the schema comes
      # from `npm run db:migrate` (scripts/start-dev.sh runs it).
      - ./db/roles.sql:/accsys/roles.sql:ro
      - ./db/docker-init/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      # Local-dev admin seed, applied by scripts/start-dev.sh. Never on a shared environment.
      - ./db/seed-local-dev.sql:/accsys/seed-local-dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accsys -d accsys"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  accsys_pgdata:
