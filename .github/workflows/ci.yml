name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: accsys_test
          POSTGRES_PASSWORD: accsys_test
          POSTGRES_DB: accsys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accsys_test -d accsys_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_ADMIN_DATABASE_URL: postgres://accsys_test:accsys_test@127.0.0.1:5432/accsys_test
      TEST_DATABASE_URL: postgres://accsys_app:accsys_app_test@127.0.0.1:5432/accsys_test
      MIGRATION_DATABASE_URL: postgres://accsys_migrator:accsys_migrator_test@127.0.0.1:5432/accsys_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Schema has no ungenerated changes
        run: |
          npx drizzle-kit generate --name ci_drift_probe
          test -z "$(git status --porcelain drizzle)" || { git status --porcelain drizzle; exit 1; }
          npx drizzle-kit check
      - name: Create roles, run real migrations, load fake fixtures
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/roles.sql
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -c "alter role accsys_migrator password 'accsys_migrator_test'" \
            -c "alter role accsys_app password 'accsys_app_test'" \
            -c "alter role accsys_backup password 'accsys_backup_test'"
          npm run db:migrate
          npm run db:migrate   # second run must be a no-op
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/integration/fixtures/base.sql
      # Runs as accsys_app. Fails (does not skip) when the DB is missing or tests fail.
      - run: npm run test:integration

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t accsys-app:ci .
      - run: docker build --target migrator -t accsys-migrate:ci .
