<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none">
  <rect width="960" height="540" rx="16" fill="#F8FAFC"/>
  <rect width="64" height="540" fill="#0F172A"/>
  <rect x="10" y="236" width="44" height="44" rx="12" fill="#059669"/>
  <text x="32" y="263" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">財會</text>
  <rect x="64" y="0" width="196" height="540" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="82" y="42" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="bold">財會管理 · 資產控管</text>
  <rect x="76" y="112" width="172" height="36" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="90" y="135" fill="#065F46" font-family="sans-serif" font-size="13" font-weight="bold">全公司財產清冊</text>
  <rect x="76" y="156" width="172" height="36" rx="8" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="90" y="179" fill="#1D4ED8" font-family="sans-serif" font-size="13" font-weight="bold">財產盤點點交管理</text>
  <text x="286" y="46" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="bold">全公司財產清冊維護 &amp; 雙階財產盤點派發管理</text>
  <rect x="286" y="68" width="644" height="190" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="310" y="100" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="bold">全公司財產清冊（/assets）：登錄新購資產、自訂欄位與 Excel 匯入匯出</text>
  <rect x="310" y="118" width="180" height="42" rx="8" fill="#2563EB"/>
  <text x="400" y="144" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">＋ 新增財產／設備登錄</text>
  <rect x="506" y="118" width="190" height="42" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text x="601" y="144" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">匯入／匯出財產 Excel</text>
  <rect x="712" y="118" width="194" height="42" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text x="809" y="144" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">資產自訂欄位管理</text>
  <text x="310" y="196" fill="#475569" font-family="sans-serif" font-size="13">• 可依保管部門、保管人、存放位置、狀態（保管中／借出／閒置／報廢）篩選全公司資產。</text>
  <rect x="286" y="276" width="644" height="232" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="310" y="310" fill="#92400E" font-family="sans-serif" font-size="16" font-weight="bold">財產盤點（/assets/inventory-forms）：派發清點單 → 保管人確認 → 清點人複核</text>
  <rect x="310" y="330" width="280" height="90" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="326" y="358" fill="#92400E" font-family="sans-serif" font-size="13" font-weight="bold">Step A：勾選保管人並指定清點時間</text>
  <text x="326" y="384" fill="#78350F" font-family="sans-serif" font-size="12">點擊「派發財產清點單」自動發送通知信</text>
  <rect x="610" y="330" width="296" height="90" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="626" y="358" fill="#065F46" font-family="sans-serif" font-size="13" font-weight="bold">Step B：開啟清點單進行清點人複核結案</text>
  <text x="626" y="384" fill="#047857" font-family="sans-serif" font-size="12">雙方確認 100% 後即可結案並匯出雙階盤點 Excel</text>
  <rect x="310" y="438" width="240" height="44" rx="8" fill="#D97706"/>
  <text x="430" y="465" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">派發財產清點系統表單</text>
  <rect x="570" y="438" width="240" height="44" rx="8" fill="#059669"/>
  <text x="690" y="465" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">開啟清點單複核／結案</text>
  <circle cx="310" cy="118" r="16" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
  <text x="310" y="123" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">1</text>
  <circle cx="310" cy="438" r="16" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
  <text x="310" y="443" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">2</text>
  <circle cx="570" cy="438" r="16" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
  <text x="570" y="443" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">3</text>
</svg>