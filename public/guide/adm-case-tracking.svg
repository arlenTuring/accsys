  <rect x="76" y="68" width="172" height="36" rx="8" fill="#F3E8FF" stroke="#8B5CF6"/>
  <text x="90" y="91" fill="#5B21B6" font-family="sans-serif" font-size="13" font-weight="bold">簽核追蹤 (/case-tracking)</text>
  <rect x="76" y="112" width="172" height="36" rx="8" fill="#EFF6FF" stroke="#3B82F6"/>
